  <line x1="1334" y1="356" x2="1334" y2="384" stroke="#16A34A" stroke-width="2.8" marker-end="url(#arrGreen)" marker-start="url(#arrGreen)"/>
  <path d="M 372 485 L 410 485 L 410 600 L 448 600" fill="none" stroke="#16A34A" stroke-width="2.8" marker-end="url(#arrGreen)"/>
  <line x1="1104" y1="586" x2="1044" y2="586" stroke="#16A34A" stroke-width="2.8" marker-end="url(#arrGreen)"/>
  <line x1="216" y1="542" x2="216" y2="580" stroke="#16A34A" stroke-width="2.8" marker-end="url(#arrGreen)"/>
