  <line x1="216" y1="318" x2="216" y2="356" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrPurple)"/>
  <path d="M 372 415 L 410 415 L 410 280 L 448 280" fill="none" stroke="#2563EB" stroke-width="2.8" marker-end="url(#arrBlue)"/>
