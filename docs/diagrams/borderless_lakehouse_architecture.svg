  <text x="526" y="342" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">TLS</text>
  <text x="526" y="382" font-size="13" font-weight="700" fill="#174EA6" text-anchor="middle">Cross-Platform</text>
  <text x="526" y="400" font-size="13" font-weight="700" fill="#174EA6" text-anchor="middle">Transport Layer</text>
  <line x1="464" y1="416" x2="588" y2="416" stroke="#AECBFA" stroke-width="1.5"/>
  <text x="526" y="440" font-size="11" font-weight="600" fill="#1967D2" text-anchor="middle">Public Internet (TLS)</text>
  <text x="526" y="457" font-size="10.5" fill="#3C4043" text-anchor="middle">Zero-setup for Databricks</text>
  <text x="526" y="473" font-size="10.5" fill="#3C4043" text-anchor="middle">Free/Community Portal</text>
  <text x="526" y="489" font-size="10.5" fill="#3C4043" text-anchor="middle">+ Scoped Vended Tokens</text>
  <line x1="464" y1="506" x2="588" y2="506" stroke="#AECBFA" stroke-width="1.5"/>
  <text x="526" y="530" font-size="11" font-weight="600" fill="#1967D2" text-anchor="middle">Optional Enterprise</text>
  <text x="526" y="547" font-size="10.5" fill="#3C4043" text-anchor="middle">Cross-Cloud Interconnect</text>
  <text x="526" y="563" font-size="10.5" fill="#3C4043" text-anchor="middle">+ GCP Service Directory</text>

  <!-- ==================== RIGHT: GOOGLE CLOUD ZONE ==================== -->
  <rect x="640" y="92" width="768" height="732" rx="12" fill="#F4F8FE" stroke="#4285F4" stroke-width="2"/>
  <circle cx="668" cy="118" r="11" fill="#4285F4"/>
  <text x="668" y="122" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">G</text>
  <text x="688" y="123" font-size="15" font-weight="700" fill="#1A73E8">Google Cloud Platform (us-east4)</text>

  <!-- VPC Service Controls Perimeter -->
  <rect x="660" y="140" width="728" height="666" rx="10" fill="#FFFFFF" stroke="#EA4335" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="676" y="130" width="356" height="22" rx="4" fill="#FCE8E6" stroke="#EA4335"/>
  <text x="854" y="145" font-size="11" font-weight="700" fill="#C5221F" text-anchor="middle">VPC Service Controls Perimeter (Exfiltration Boundary)</text>

  <!-- Column 1 inside GCP: Lakehouse Core -->
  <rect x="680" y="172" width="336" height="156" rx="10" fill="#E8F0FE" stroke="#1967D2" stroke-width="2" filter="url(#cardShadow)"/>
  <polygon points="710,196 728,206 728,226 710,236 692,226 692,206" fill="#1A73E8"/>
  <text x="710" y="220" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">BL</text>
  <text x="740" y="204" font-size="14" font-weight="700" fill="#174EA6">Lakehouse Federated Catalog (GA)</text>
  <text x="740" y="222" font-size="11" fill="#1967D2" font-family="monospace">--catalog-type=federated</text>
  <text x="696" y="250" font-size="11.5" fill="#3C4043">• Syncs Iceberg snapshots (--refresh-interval=300s)</text>
  <text x="696" y="270" font-size="11.5" fill="#3C4043">• OIDC Service Agent + Regional Secret Manager</text>
  <text x="696" y="290" font-size="11.5" fill="#174EA6" font-weight="600">• User Identity Federation (Mints End-User OIDC)</text>
  <text x="696" y="310" font-size="11.5" fill="#3C4043">• Exposes Iceberg REST (bl://) + BigQuery 4-part SQL</text>

  <rect x="680" y="352" width="336" height="176" rx="10" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="2" filter="url(#cardShadow)"/>
  <polygon points="710,376 728,386 728,406 710,416 692,406 692,386" fill="#1E8E3E"/>
  <text x="710" y="400" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CACHE</text>
  <text x="740" y="384" font-size="14" font-weight="700" fill="#0D652D">Intelligent Cross-Cloud Cache (GA)</text>
  <text x="740" y="402" font-size="11" fill="#137333" font-family="monospace">--cross-cloud-cache=enabled</text>
  <text x="696" y="430" font-size="11.5" fill="#3C4043">• Block-level read-through cache in us-east4</text>
  <text x="696" y="450" font-size="11.5" fill="#0D652D" font-weight="600">• Eliminates repeat remote egress fees ($0 repeat)</text>
  <text x="696" y="470" font-size="11.5" fill="#3C4043">• Google-owned &amp; managed encryption keys</text>
  <text x="696" y="490" font-size="11.5" fill="#3C4043">• Auto-bypasses if restrictNonCmekServices applies</text>
  <text x="696" y="510" font-size="11" fill="#137333" font-family="monospace">Stats: cacheBytesRead | objectStorageBytesRead</text>

  <rect x="680" y="552" width="336" height="104" rx="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="698" y="578" font-size="13" font-weight="700" fill="#B06000">Unified Security &amp; Knowledge Catalog</text>
  <text x="698" y="598" font-size="11.5" fill="#3C4043">• Cloud IAM (BigLake Viewer, BigQuery Data Viewer)</text>
  <text x="698" y="618" font-size="11.5" fill="#3C4043">• Service Directory (Private CCI DNS/IP routing)</text>
  <text x="698" y="638" font-size="11.5" fill="#3C4043">• Knowledge Catalog profiling &amp; cross-platform lineage</text>

  <rect x="680" y="676" width="336" height="110" rx="10" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="698" y="704" font-size="13" font-weight="700" fill="#174EA6">Native BigQuery Managed Tables</text>
  <text x="698" y="726" font-size="11.5" fill="#1967D2" font-family="monospace">commerce_core.orders</text>
  <text x="698" y="746" font-size="11.5" fill="#1967D2" font-family="monospace">commerce_core.customer_ltv</text>
  <text x="698" y="768" font-size="11" fill="#5F6368">Joined in-place with AWS Glue &amp; Databricks UC</text>

  <!-- Column 2 inside GCP: Compute & Agentic AI -->
  <rect x="1064" y="172" width="304" height="148" rx="10" fill="#1A73E8" stroke="#174EA6" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="1096" cy="204" r="16" fill="#FFFFFF"/>
  <text x="1096" y="209" font-size="12" font-weight="700" fill="#1A73E8" text-anchor="middle">BQ</text>
  <text x="1122" y="202" font-size="15" font-weight="700" fill="#FFFFFF">Google BigQuery</text>
  <text x="1122" y="220" font-size="11.5" fill="#D2E3FC">Vectorized Cross-Platform SQL &amp; AI</text>
  <text x="1080" y="250" font-size="11.5" fill="#FFFFFF" font-family="monospace">SELECT ... FROM</text>
  <text x="1080" y="268" font-size="11" fill="#E8F0FE" font-family="monospace">`proj.dbx_uc.supply_chain.*`</text>
  <text x="1080" y="286" font-size="11" fill="#E8F0FE" font-family="monospace">JOIN `proj.aws_glue.fulfill.*`</text>
  <text x="1080" y="304" font-size="11" fill="#E8F0FE" font-family="monospace">JOIN `proj.commerce.orders`</text>

  <rect x="1064" y="344" width="304" height="136" rx="10" fill="#FFFFFF" stroke="#1967D2" stroke-width="2" filter="url(#cardShadow)"/>
  <polygon points="1096,368 1112,377 1112,395 1096,404 1080,395 1080,377" fill="#FBBC04"/>
  <text x="1096" y="390" font-size="9.5" font-weight="700" fill="#202124" text-anchor="middle">SPARK</text>
  <text x="1120" y="382" font-size="13.5" font-weight="700" fill="#174EA6">Managed Apache Spark</text>
  <text x="1120" y="400" font-size="11" fill="#5F6368">Lightning Engine + Open Spark</text>
  <text x="1080" y="426" font-size="11" fill="#3C4043" font-family="monospace">warehouse = bl://dbx_unity_merch</text>
  <text x="1080" y="445" font-size="11" fill="#1E8E3E" font-weight="600">X-Iceberg-Access-Delegation:</text>
  <text x="1080" y="462" font-size="11" fill="#1E8E3E" font-family="monospace">vended-credentials</text>

  <rect x="1064" y="504" width="304" height="282" rx="10" fill="#F3E8FD" stroke="#8430CE" stroke-width="2" filter="url(#cardShadow)"/>
  <polygon points="1096,528 1112,537 1112,555 1096,564 1080,555 1080,537" fill="#8430CE"/>
  <text x="1096" y="550" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">ADK</text>
  <text x="1120" y="542" font-size="14" font-weight="700" fill="#4A148C">Google ADK 2.x Agents</text>
  <text x="1120" y="560" font-size="11.5" font-weight="700" fill="#7627BB">Model: gemini-3.8-flash</text>

  <rect x="1080" y="578" width="272" height="88" rx="6" fill="#FFFFFF" stroke="#C58AF9"/>
  <text x="1092" y="598" font-size="12" font-weight="700" fill="#4A148C">1. Cross-Platform Analyst Agent</text>
  <text x="1092" y="616" font-size="10.5" fill="#3C4043">• BigQueryToolset (WriteMode.BLOCKED)</text>
  <text x="1092" y="633" font-size="10.5" fill="#3C4043">• OAuth Token Pass-Through for UC ACLs</text>
  <text x="1092" y="650" font-size="10.5" fill="#1E8E3E" font-weight="600">• Multi-turn SQL hits local cache!</text>

  <rect x="1080" y="678" width="272" height="92" rx="6" fill="#FFFFFF" stroke="#C58AF9"/>
  <text x="1092" y="698" font-size="12" font-weight="700" fill="#4A148C">2. FinOps Cache Telemetry Agent</text>
  <text x="1092" y="716" font-size="10.5" fill="#3C4043">• Inspects job.objectStorageStats</text>
  <text x="1092" y="733" font-size="10.5" fill="#3C4043">• Computes Cache Hit % &amp; Egress $ Saved</text>
  <text x="1092" y="750" font-size="10.5" fill="#3C4043">• Recommends cache &amp; CCI optimizations</text>

