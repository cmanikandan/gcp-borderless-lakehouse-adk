<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#CBD5E1" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1A73E8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E11D48"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1600" height="940" fill="#F8FAFC"/>
  <rect width="1600" height="940" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1528" height="74" rx="14" fill="#0F172A" filter="url(#shadow)"/>
  <text x="64" y="56" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#FFFFFF">Google Cloud Borderless Lakehouse — Cross-Platform Reference Architecture (POC)</text>
  <text x="64" y="81" font-family="DejaVu Sans" font-size="14" fill="#94A3B8">Zero-ETL Apache Iceberg Federation · Regional Intelligent Block Caching ($0 Extra GCP Fee) · OIDC Identity Propagation · Google ADK 2.x + Gemini 3.8 Flash</text>

  <!-- Left Top: AWS Cloud -->
  <g filter="url(#shadow)">
    <rect x="36" y="122" width="390" height="370" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
    <rect x="36" y="122" width="390" height="44" rx="14" fill="#FEF3C7"/>
    <text x="58" y="150" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#B45309">AWS Cloud (us-east-1 — Logistics)</text>

    <rect x="60" y="184" width="342" height="86" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="80" y="211" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1E293B">AWS Glue Data Catalog</text>
    <text x="80" y="233" font-family="DejaVu Sans Mono" font-size="12" fill="#475569">--glue-warehouse="123456789012"</text>
    <text x="80" y="253" font-family="DejaVu Sans" font-size="12" fill="#64748B">or 123456789012:s3tablescatalog/&lt;bucket&gt;</text>

    <rect x="60" y="286" width="342" height="74" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="80" y="312" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#334155">AWS IAM Role (Secretless OIDC)</text>
    <text x="80" y="333" font-family="DejaVu Sans Mono" font-size="11.5" fill="#475569">aud &amp; sub = biglake-service-account-id</text>
    <text x="80" y="350" font-family="DejaVu Sans" font-size="11.5" fill="#64748B">Zero static AWS keys stored in Google Cloud</text>

    <rect x="60" y="376" width="342" height="96" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
    <text x="80" y="404" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#065F46">Amazon S3 (Apache Iceberg v2)</text>
    <text x="80" y="427" font-family="DejaVu Sans Mono" font-size="12.5" fill="#047857">fulfillment.shipment_events</text>
    <text x="80" y="449" font-family="DejaVu Sans" font-size="12" fill="#334155">Parquet (ZSTD) · Seeded via Serverless Athena v3</text>
  </g>

  <!-- Left Bottom: Standalone Databricks Platform -->
  <g filter="url(#shadow)">
    <rect x="36" y="516" width="390" height="392" rx="16" fill="#FFF1F2" stroke="#E11D48" stroke-width="2.5"/>
    <rect x="36" y="516" width="390" height="44" rx="14" fill="#FFE4E6"/>
    <text x="54" y="544" font-family="DejaVu Sans" font-size="15.8" font-weight="bold" fill="#BE123C">Databricks Platform (Standalone Portal)</text>

    <rect x="60" y="578" width="342" height="90" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
    <text x="80" y="604" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1E293B">Databricks Unity Catalog</text>
    <text x="80" y="625" font-family="DejaVu Sans Mono" font-size="11.5" fill="#475569">dbc-xxxx.cloud.databricks.com</text>
    <text x="80" y="646" font-family="DejaVu Sans" font-size="12" fill="#64748B">External Data Access + EXTERNAL USE SCHEMA</text>

    <rect x="60" y="684" width="342" height="82" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="80" y="710" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#334155">Identity &amp; Audit Governance</text>
    <text x="80" y="731" font-family="DejaVu Sans" font-size="12" fill="#475569">SP OAuth / OIDC + User Identity Federation</text>
    <text x="80" y="751" font-family="DejaVu Sans Mono" font-size="11.5" fill="#BE123C">system.access.audit (Row/Col Security)</text>

    <rect x="60" y="782" width="342" height="106" rx="10" fill="#FFF5F5" stroke="#F43F5E" stroke-width="1.8"/>
    <text x="80" y="809" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#9F1239">Unity Catalog External Location</text>
    <text x="80" y="832" font-family="DejaVu Sans Mono" font-size="12" fill="#881337">supply_chain.supplier_risk_scores</text>
    <text x="80" y="852" font-family="DejaVu Sans Mono" font-size="12" fill="#881337">supply_chain.sku_margins</text>
    <text x="80" y="873" font-family="DejaVu Sans" font-size="11.5" fill="#475569">Delta Lake + Iceberg UniForm (Zero DBX Compute)</text>
  </g>

  <!-- Center Transport Bridge -->
  <g filter="url(#shadow)">
    <rect x="466" y="340" width="186" height="330" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="559" y="376" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1E40AF">Cross-Cloud</text>
    <text x="559" y="397" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1E40AF">Transport</text>
    <line x1="488" y1="414" x2="630" y2="414" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="484" y="444" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" fill="#1E293B">1. TLS 1.3 HTTPS</text>
    <text x="484" y="464" font-family="DejaVu Sans" font-size="11.5" fill="#475569">Zero-setup default for</text>
    <text x="484" y="481" font-family="DejaVu Sans" font-size="11.5" fill="#475569">Free Edition Portal</text>

    <text x="484" y="518" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" fill="#1E293B">2. Private CCI</text>
    <text x="484" y="538" font-family="DejaVu Sans" font-size="11.5" fill="#475569">Cross-Cloud Interconnect</text>
    <text x="484" y="555" font-family="DejaVu Sans" font-size="11.5" fill="#475569">+ Service Directory</text>

    <rect x="482" y="584" width="154" height="64" rx="8" fill="#DBEAFE"/>
    <text x="559" y="610" text-anchor="middle" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#1E3A8A">Short-Lived Vended</text>
    <text x="559" y="628" text-anchor="middle" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#1E3A8A">Storage Tokens</text>
  </g>

  <!-- Right: Google Cloud Zone + Single VPC-SC Perimeter -->
  <g filter="url(#shadow)">
    <rect x="692" y="122" width="872" height="786" rx="18" fill="#F0F7FF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="718" y="150" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1D4ED8">Google Cloud (us-east4 — Co-located with AWS us-east-1)</text>

    <!-- Single Clean VPC Service Controls Dashed Box -->
    <rect x="714" y="172" width="828" height="714" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" stroke-dasharray="8,6"/>
    <rect x="734" y="159" width="602" height="26" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="746" y="177" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" fill="#B91C1C">VPC Service Controls Perimeter (biglake.googleapis.com &amp; bigquery.googleapis.com)</text>

    <!-- Column 1 inside GCP: Lakehouse Catalog + Cache + IAM + Native BQ -->
    <rect x="740" y="206" width="376" height="156" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
    <circle cx="766" cy="234" r="13" fill="#1D4ED8"/>
    <text x="766" y="239" text-anchor="middle" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" fill="#FFFFFF">BL</text>
    <text x="788" y="239" font-family="DejaVu Sans" font-size="14.8" font-weight="bold" fill="#1E3A8A">Lakehouse Federated Catalogs (GA)</text>
    <text x="758" y="266" font-family="DejaVu Sans Mono" font-size="12" fill="#1E40AF">--catalog-type="federated"</text>
    <text x="758" y="287" font-family="DejaVu Sans Mono" font-size="12" fill="#1E40AF">--refresh-interval="300s"</text>
    <text x="758" y="310" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• Syncs dbx_unity_merch &amp; aws_glue_logistics</text>
    <text x="758" y="330" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• Vends scoped tokens via Iceberg REST API</text>
    <text x="758" y="350" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• Mints End-User OIDC JWTs for Unity Catalog</text>

    <rect x="740" y="388" width="376" height="176" rx="12" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.2"/>
    <circle cx="768" cy="416" r="14" fill="#16A34A"/>
    <text x="768" y="421" text-anchor="middle" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#FFFFFF">IC</text>
    <text x="792" y="421" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#065F46">Intelligent Regional Cache (GA)</text>
    <text x="758" y="447" font-family="DejaVu Sans Mono" font-size="12" fill="#047857">--cross-cloud-cache="enabled"</text>
    <text x="758" y="470" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" fill="#065F46">• $0 Extra Google Cloud Fee · $0 Repeat Egress</text>
    <text x="758" y="491" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• Block-level Parquet read-through cache</text>
    <text x="758" y="512" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• Verifies remote metadata &amp; ACLs per query</text>
    <text x="758" y="534" font-family="DejaVu Sans Mono" font-size="11.5" fill="#047857">objectStorageStats.cacheBytesRead</text>

    <rect x="740" y="590" width="376" height="114" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
    <text x="758" y="618" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1E3A8A">Native BigQuery Storage (us-east4)</text>
    <text x="758" y="643" font-family="DejaVu Sans Mono" font-size="13" fill="#1D4ED8">commerce_core.orders</text>
    <text x="758" y="666" font-family="DejaVu Sans" font-size="12.5" fill="#334155">Partitioned by order_ts · Clustered by region, sku</text>
    <text x="758" y="687" font-family="DejaVu Sans" font-size="12" fill="#64748B">Joined in place with AWS Glue &amp; Databricks UC</text>

    <rect x="740" y="728" width="376" height="134" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
    <text x="758" y="756" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#92400E">Cloud IAM &amp; Regional Secret Manager</text>
    <text x="758" y="779" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• Regional secret: secretmanager.us-east4.rep</text>
    <text x="758" y="800" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• BigQuery Cross-Cloud Connection cache option</text>
    <text x="758" y="821" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• INFORMATION_SCHEMA.JOBS FinOps audit</text>
    <text x="758" y="843" font-family="DejaVu Sans Mono" font-size="11.5" fill="#B45309">Note: Avoid restrictNonCmekServices on cache</text>

    <!-- Column 2 inside GCP: Compute & Agentic AI -->
    <rect x="1176" y="206" width="342" height="156" rx="12" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="2"/>
    <text x="1198" y="238" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#FFFFFF">Google BigQuery Engine</text>
    <text x="1198" y="264" font-family="DejaVu Sans Mono" font-size="12" fill="#DBEAFE">`proj.catalog.namespace.table`</text>
    <text x="1198" y="289" font-family="DejaVu Sans" font-size="12.5" fill="#EFF6FF">• Zero-ETL 3-platform SQL joins</text>
    <text x="1198" y="310" font-family="DejaVu Sans" font-size="12.5" fill="#EFF6FF">• Column &amp; predicate pushdown</text>
    <text x="1198" y="331" font-family="DejaVu Sans" font-size="12.5" fill="#EFF6FF">• Native AI.FORECAST (TimesFM 2.0)</text>

    <rect x="1176" y="392" width="342" height="156" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="1198" y="422" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#9A3412">Managed Apache Spark 2.3</text>
    <text x="1198" y="446" font-family="DejaVu Sans Mono" font-size="11.5" fill="#C2410C">bl://projects/&lt;PROJ&gt;/catalogs/&lt;CAT&gt;</text>
    <text x="1198" y="470" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• Iceberg REST vended-credentials</text>
    <text x="1198" y="491" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• GoogleAuthManager + S3/GCSFileIO</text>
    <text x="1198" y="512" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• Zero AWS/DBX secrets on executors</text>

    <rect x="1176" y="578" width="342" height="284" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.2"/>
    <text x="1198" y="608" font-family="DejaVu Sans" font-size="16.5" font-weight="bold" fill="#5B21B6">Google ADK 2.x Agentic Copilot</text>
    <text x="1198" y="630" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="bold" fill="#6D28D9">Model: gemini-3.8-flash</text>
    <rect x="1194" y="646" width="306" height="62" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text x="1208" y="668" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" fill="#4C1D95">lakehouse_practitioner_copilot</text>
    <text x="1208" y="688" font-family="DejaVu Sans" font-size="11.5" fill="#475569">Root Orchestrator (ThinkingLevel.LOW)</text>

    <rect x="1194" y="718" width="306" height="62" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text x="1208" y="740" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" fill="#1E40AF">1. cross_cloud_supply_chain_analyst</text>
    <text x="1208" y="760" font-family="DejaVu Sans" font-size="11.5" fill="#475569">BigQueryToolset (BLOCKED) + REST Discovery</text>

    <rect x="1194" y="790" width="306" height="58" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text x="1208" y="812" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" fill="#065F46">2. finops_cache_telemetry_advisor</text>
    <text x="1208" y="832" font-family="DejaVu Sans" font-size="11.5" fill="#475569">Audits LATEST job cache &amp; egress ROI</text>
  </g>

  <!-- Clean Routing Arrows -->
  <!-- Metadata Sync:Glue & DBX <-> Bridge <-> Lakehouse Catalog -->
  <path d="M 402 226 L 466 390" fill="none" stroke="#EA580C" stroke-width="2.4" marker-end="url(#arrOrange)"/>
  <path d="M 402 622 L 466 520" fill="none" stroke="#E11D48" stroke-width="2.4" marker-end="url(#arrRed)"/>
  <path d="M 652 430 L 740 284" fill="none" stroke="#1A73E8" stroke-width="2.6" marker-end="url(#arrBlue)" marker-start="url(#arrBlue)"/>

  <!-- Cold Read Data Path: S3 & UC Ext -> Bridge -> Intelligent Cache -->
  <path d="M 402 424 L 466 465" fill="none" stroke="#16A34A" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arrGreen)"/>
  <path d="M 402 830 L 466 595" fill="none" stroke="#16A34A" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arrGreen)"/>
  <path d="M 652 510 L 740 476" fill="none" stroke="#16A34A" stroke-width="2.8" stroke-dasharray="6,4" marker-end="url(#arrGreen)"/>

  <!-- Inside GCP: Catalog + Cache + Native BQ -> BigQuery & Spark & ADK -->
  <line x1="1116" y1="260" x2="1176" y2="260" stroke="#1A73E8" stroke-width="2.6" marker-end="url(#arrBlue)"/>
  <path d="M 1116 460 L 1146 460 L 1146 310 L 1176 310" fill="none" stroke="#16A34A" stroke-width="3.2" marker-end="url(#arrGreen)"/>
  <path d="M 1116 320 L 1156 320 L 1156 450 L 1176 450" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrOrange)"/>
  <path d="M 1116 645 L 1160 645 L 1160 342 L 1176 342" fill="none" stroke="#1A73E8" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <line x1="1347" y1="578" x2="1347" y2="548" stroke="#7C3AED" stroke-width="1" stroke-opacity="0"/>
  <path d="M 1518 680 L 1534 680 L 1534 284 L 1518 284" fill="none" stroke="#7C3AED" stroke-width="2.8" marker-end="url(#arrPurple)" marker-start="url(#arrPurple)"/>
</svg>