  <!-- Canvas Background -->
  <rect width="1440" height="860" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="36" y="42" font-size="22" font-weight="700" fill="#202124">Google Cloud Borderless Lakehouse — Principal Architect Reference Blueprint</text>
  <text x="36" y="66" font-size="13.5" fill="#5F6368">Zero-ETL Iceberg Federation (AWS Glue &amp; Standalone Databricks Unity Catalog) · Regional Intelligent Block Cache · Google ADK + Gemini 3.8 Flash</text>

  <!-- ==================== TOP LEFT: STANDALONE AWS CLOUD ZONE ==================== -->
  <rect x="32" y="92" width="380" height="352" rx="12" fill="#FFFDF7" stroke="#FF9900" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="48" y="106" width="54" height="24" rx="4" fill="#FF9900"/>
  <text x="75" y="123" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">AWS</text>
  <text x="112" y="123" font-size="14.5" font-weight="700" fill="#B35900">Amazon Web Services (us-east-1)</text>

  <!-- Glue Card -->
  <rect x="56" y="146" width="332" height="74" rx="8" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.5"/>
  <polygon points="84,166 100,175 100,193 84,202 68,193 68,175" fill="#FB8C00"/>
  <text x="84" y="188" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">GLUE</text>
  <text x="112" y="170" font-size="13" font-weight="700" fill="#202124">AWS Glue Data Catalog (IRC)</text>
  <text x="112" y="188" font-size="11" fill="#5F6368">Iceberg REST Endpoint · Warehouse: Account ID</text>
  <text x="112" y="206" font-size="11" fill="#B35900" font-weight="600">OIDC Role: accounts.google.com:sub</text>

  <!-- AWS IAM Trust Pill -->
  <rect x="56" y="232" width="332" height="44" rx="6" fill="#F8F9FA" stroke="#DADCE0"/>
  <text x="222" y="251" font-size="11" font-weight="600" fill="#3C4043" text-anchor="middle">IAM Role Trust Policy (12h Session · Lake Formation)</text>
  <text x="222" y="267" font-size="10.5" fill="#5F6368" text-anchor="middle">Verifies Google BigLake Service Agent JWT</text>

  <!-- S3 Iceberg Card -->
  <rect x="56" y="288" width="332" height="136" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <polygon points="84,332 100,341 100,359 84,368 68,359 68,341" fill="#2E7D32"/>
  <text x="84" y="354" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">S3</text>
  <text x="112" y="318" font-size="13" font-weight="700" fill="#1B5E20">Amazon S3 / Amazon S3 Tables</text>
  <text x="112" y="340" font-size="11.5" fill="#2E7D32" font-family="monospace">fulfillment.shipment_events</text>
  <text x="112" y="360" font-size="11.5" fill="#2E7D32" font-family="monospace">fulfillment.inventory_snapshots</text>
  <text x="112" y="386" font-size="11" fill="#5F6368">Apache Iceberg Parquet + Metadata Manifests</text>
  <text x="112" y="406" font-size="10.5" fill="#5F6368">Zero AWS Athena / EMR Compute Invoked!</text>

  <!-- ==================== BOTTOM LEFT: STANDALONE DATABRICKS PLATFORM ==================== -->
  <rect x="32" y="466" width="380" height="358" rx="12" fill="#FFF8F7" stroke="#E53935" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="48" y="480" width="54" height="24" rx="4" fill="#E53935"/>
  <text x="75" y="497" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">DBX</text>
  <text x="112" y="497" font-size="14.5" font-weight="700" fill="#B71C1C">Databricks Platform (SaaS Portal / Free Ed.)</text>

  <!-- Unity Catalog Card -->
  <rect x="56" y="520" width="332" height="76" rx="8" fill="#FDEDEC" stroke="#E53935" stroke-width="1.5"/>
  <polygon points="84,540 100,549 100,567 84,576 68,567 68,549" fill="#D93025"/>
  <text x="84" y="562" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">UC</text>
  <text x="112" y="542" font-size="13" font-weight="700" fill="#202124">Databricks Unity Catalog</text>
  <text x="112" y="560" font-size="11" fill="#5F6368">Standalone Workspace Portal + Credential Vending</text>
  <text x="112" y="578" font-size="11" fill="#C5221F" font-weight="600">EXTERNAL USE SCHEMA · OIDC / Secret Auth</text>

  <!-- Audit Log Pill -->
  <rect x="56" y="608" width="332" height="52" rx="6" fill="#FFFFFF" stroke="#DADCE0"/>
  <text x="222" y="629" font-size="11" font-weight="600" fill="#3C4043" text-anchor="middle">End-User OIDC Identity Federation + Audit Trail</text>
  <text x="222" y="647" font-size="10.5" fill="#C5221F" font-family="monospace" text-anchor="middle">system.access.audit (user_identity.email)</text>

  <!-- Unity External Location Card -->
  <rect x="56" y="672" width="332" height="132" rx="8" fill="#FFFFFF" stroke="#D32F2F" stroke-width="1.5"/>
  <polygon points="84,714 100,723 100,741 84,750 68,741 68,723" fill="#C62828"/>
  <text x="84" y="736" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">EXT</text>
  <text x="112" y="700" font-size="13" font-weight="700" fill="#B71C1C">Unity Catalog External Location</text>
  <text x="112" y="722" font-size="11.5" fill="#C62828" font-family="monospace">supply_chain.supplier_risk_scores</text>
  <text x="112" y="740" font-size="11.5" fill="#C62828" font-family="monospace">supply_chain.sku_margins</text>
  <text x="112" y="764" font-size="11" fill="#5F6368">Delta UniForm / Apache Iceberg Tables</text>
  <text x="112" y="784" font-size="10.5" fill="#5F6368">Zero Databricks SQL Warehouse DBU Invoked!</text>

  <!-- ==================== CENTER: NETWORK TRANSPORT ==================== -->
  <rect x="444" y="290" width="164" height="310" rx="12" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2" filter="url(#cardShadow)"/>
