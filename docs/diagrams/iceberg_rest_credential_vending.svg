<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#CBD5E1" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1A73E8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E11D48"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1600" height="800" fill="#F8FAFC"/>
  <rect width="1600" height="800" fill="url(#grid)"/>

  <rect x="36" y="24" width="1528" height="72" rx="14" fill="#0F172A" filter="url(#shadow)"/>
  <text x="64" y="55" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#FFFFFF">Zero-Secret Multi-Engine Access — BigQuery SQL &amp; Managed Spark Iceberg REST Credential Vending</text>
  <text x="64" y="79" font-family="DejaVu Sans" font-size="14" fill="#94A3B8">One federated catalog endpoint serves both serverless SQL (cache-accelerated) and Apache Spark 2.3 (short-lived vended tokens)</text>

  <!-- Left: Federated Catalog & Iceberg REST Endpoint -->
  <g filter="url(#shadow)">
    <rect x="36" y="128" width="490" height="632" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4"/>
    <rect x="36" y="128" width="490" height="48" rx="14" fill="#DBEAFE"/>
    <text x="60" y="159" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#1E40AF">Google Cloud Lakehouse Iceberg REST Catalog</text>

    <rect x="60" y="198" width="442" height="128" rx="10" fill="#0F172A"/>
    <text x="78" y="226" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" fill="#38BDF8">Unified REST Endpoint (GA)</text>
    <text x="78" y="252" font-family="DejaVu Sans Mono" font-size="12" fill="#F8FAFC">https://biglake.googleapis.com/</text>
    <text x="78" y="271" font-family="DejaVu Sans Mono" font-size="12" fill="#F8FAFC">  iceberg/v1/restcatalog</text>
    <text x="78" y="298" font-family="DejaVu Sans Mono" font-size="11.5" fill="#4ADE80">warehouse: bl://projects/&lt;PROJ&gt;/catalogs/&lt;CAT&gt;</text>
    <text x="78" y="316" font-family="DejaVu Sans Mono" font-size="11.5" fill="#FBBF24">X-Iceberg-Access-Delegation: vended-credentials</text>

    <rect x="60" y="348" width="442" height="176" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="78" y="376" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#1E3A8A">Synchronized Federated Catalogs (300s)</text>
    <text x="78" y="404" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="bold" fill="#BE123C">1) dbx_unity_merch (Unity Catalog)</text>
    <text x="78" y="426" font-family="DejaVu Sans" font-size="12.5" fill="#334155">   • supply_chain.supplier_risk_scores</text>
    <text x="78" y="446" font-family="DejaVu Sans" font-size="12.5" fill="#334155">   • supply_chain.sku_margins</text>
    <text x="78" y="476" font-family="DejaVu Sans Mono" font-size="12.5" font-weight="bold" fill="#B45309">2) aws_glue_logistics (AWS Glue)</text>
    <text x="78" y="498" font-family="DejaVu Sans" font-size="12.5" fill="#334155">   • fulfillment.shipment_events</text>

    <rect x="60" y="546" width="442" height="190" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="78" y="574" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#065F46">How Credential Vending Works</text>
    <text x="78" y="600" font-family="DejaVu Sans" font-size="12.5" fill="#334155">1. Engine authenticates to GCP via GoogleAuthManager</text>
    <text x="78" y="622" font-family="DejaVu Sans" font-size="12.5" fill="#334155">2. Lakehouse exchanges OIDC trust with AWS STS /</text>
    <text x="78" y="642" font-family="DejaVu Sans" font-size="12.5" fill="#334155">   Databricks Unity Catalog External Location</text>
    <text x="78" y="664" font-family="DejaVu Sans" font-size="12.5" fill="#334155">3. Returns short-lived, table-scoped STS / OAuth</text>
    <text x="78" y="684" font-family="DejaVu Sans" font-size="12.5" fill="#334155">   read tokens in the Iceberg loadTable response</text>
    <text x="78" y="712" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" fill="#047857">Result: Zero static AWS/DBX secrets in Spark or BQ!</text>
  </g>

  <!-- Right Top: Compute Engine 1 — BigQuery -->
  <g filter="url(#shadow)">
    <rect x="606" y="128" width="958" height="292" rx="16" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.2"/>
    <rect x="606" y="128" width="958" height="46" rx="14" fill="#1D4ED8"/>
    <text x="632" y="158" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#FFFFFF">Engine Path A: Google BigQuery — 4-Part SQL + Intelligent Regional Cache</text>

    <rect x="632" y="194" width="440" height="202" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="652" y="222" font-family="DejaVu Sans" font-size="14.5" font-weight="bold" fill="#1E3A8A">Interactive BI, Joins &amp; AI.FORECAST</text>
    <text x="652" y="248" font-family="DejaVu Sans Mono" font-size="12" fill="#1D4ED8">FROM `proj.commerce_core.orders` o</text>
    <text x="652" y="269" font-family="DejaVu Sans Mono" font-size="12" fill="#1D4ED8">JOIN `proj.dbx_unity_merch.supply_chain.sku_margins`</text>
    <text x="652" y="290" font-family="DejaVu Sans Mono" font-size="12" fill="#1D4ED8">JOIN `proj.aws_glue_logistics.fulfillment.shipment_events`</text>
    <text x="652" y="322" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• Supports User Identity Federation to Unity Catalog</text>
    <text x="652" y="344" font-family="DejaVu Sans" font-size="12.5" fill="#334155">• Powers Google ADK BigQueryToolset (`execute_sql`)</text>
    <text x="652" y="366" font-family="DejaVu Sans" font-size="12.5" font-weight="bold" fill="#047857">• Uses Regional Intelligent Cache ($0 repeat egress!)</text>

    <rect x="1102" y="194" width="436" height="202" rx="10" fill="#ECFDF5" stroke="#34D399"/>
    <text x="1122" y="222" font-family="DejaVu Sans" font-size="14.5" font-weight="bold" fill="#065F46">Verified 3-Platform Join Output (POC Seed)</text>
    <text x="1122" y="250" font-family="DejaVu Sans Mono" font-size="11.5" fill="#0F172A">Region       | Category    | Delay | Margin Risk</text>
    <line x1="1122" y1="258" x2="1518" y2="258" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="1122" y="280" font-family="DejaVu Sans Mono" font-size="11.5" fill="#065F46">US-NORTHEAST | Apparel     |  19h  | $24,412.00</text>
    <text x="1122" y="302" font-family="DejaVu Sans Mono" font-size="11.5" fill="#065F46">US-NORTHEAST | Electronics |  28h  |  $7,740.00</text>
    <text x="1122" y="324" font-family="DejaVu Sans Mono" font-size="11.5" fill="#065F46">US-WEST      | Packaging   |  36h  |  $7,050.00</text>
    <text x="1122" y="358" font-family="DejaVu Sans" font-size="12" fill="#475569">ORD-8803 (2h delay, 0.14 risk) pruned automatically</text>
    <text x="1122" y="378" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#047857">Total Margin Exposure Identified: $39,202.00</text>
  </g>

  <!-- Right Bottom: Compute Engine 2 — Managed Spark -->
  <g filter="url(#shadow)">
    <rect x="606" y="452" width="958" height="308" rx="16" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.2"/>
    <rect x="606" y="452" width="958" height="46" rx="14" fill="#EA580C"/>
    <text x="632" y="482" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#FFFFFF">Engine Path B: Google Cloud Managed Service for Apache Spark (Runtime 2.3)</text>

    <rect x="632" y="518" width="468" height="218" rx="10" fill="#0F172A"/>
    <text x="650" y="544" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#FB923C">Verified GA SparkSession Properties</text>
    <text x="650" y="568" font-family="DejaVu Sans Mono" font-size="11.2" fill="#E2E8F0">spark.sql.catalog.&lt;cat&gt;.type = rest</text>
    <text x="650" y="588" font-family="DejaVu Sans Mono" font-size="11.2" fill="#E2E8F0">spark.sql.catalog.&lt;cat&gt;.uri =</text>
    <text x="650" y="605" font-family="DejaVu Sans Mono" font-size="11.2" fill="#38BDF8">  https://biglake.googleapis.com/iceberg/v1/restcatalog</text>
    <text x="650" y="625" font-family="DejaVu Sans Mono" font-size="11.2" fill="#4ADE80">warehouse = bl://projects/&lt;PROJ&gt;/catalogs/&lt;CAT&gt;</text>
    <text x="650" y="645" font-family="DejaVu Sans Mono" font-size="11.2" fill="#FBBF24">rest.auth.type = ...gcp.auth.GoogleAuthManager</text>
    <text x="650" y="665" font-family="DejaVu Sans Mono" font-size="11.2" fill="#E2E8F0">glue.io-impl = org.apache.iceberg.aws.s3.S3FileIO</text>
    <text x="650" y="685" font-family="DejaVu Sans Mono" font-size="11.2" fill="#E2E8F0">unity.io-impl = org.apache.iceberg.gcp.gcs.GCSFileIO</text>
    <text x="650" y="712" font-family="DejaVu Sans" font-size="11.5" fill="#94A3B8">Outbound S3: Cloud Router + Cloud NAT (or Private CCI)</text>

    <rect x="1122" y="518" width="416" height="218" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="1142" y="546" font-family="DejaVu Sans" font-size="14.5" font-weight="bold" fill="#9A3412">PySpark Composite Disruption Scoring</text>
    <text x="1142" y="574" font-family="DejaVu Sans Mono" font-size="11.5" fill="#0F172A">Order    | SKU      | Delay | Disruption Idx</text>
    <line x1="1142" y1="582" x2="1518" y2="582" stroke="#FED7AA" stroke-width="1.5"/>
    <text x="1142" y="604" font-family="DejaVu Sans Mono" font-size="11.5" fill="#9A3412">ORD-8801 | SKU-9001 |  28h  |     0.9927</text>
    <text x="1142" y="626" font-family="DejaVu Sans Mono" font-size="11.5" fill="#9A3412">ORD-8804 | SKU-9004 |  36h  |     0.8745</text>
    <text x="1142" y="648" font-family="DejaVu Sans Mono" font-size="11.5" fill="#9A3412">ORD-8802 | SKU-9003 |  19h  |     0.7459</text>
    <text x="1142" y="684" font-family="DejaVu Sans" font-size="12" fill="#475569">Note: Spark reads directly from remote storage</text>
    <text x="1142" y="704" font-family="DejaVu Sans" font-size="12" fill="#475569">via vended credentials (BigQuery uses Cache).</text>
  </g>

  <!-- Connector Arrows -->
  <line x1="526" y1="274" x2="606" y2="274" stroke="#1D4ED8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <line x1="526" y1="606" x2="606" y2="606" stroke="#EA580C" stroke-width="3" marker-end="url(#arrOrange)"/>
</svg>