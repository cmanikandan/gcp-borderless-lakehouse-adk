[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcp-borderless-lakehouse-adk"
version = "0.2.0"
description = "Google Cloud Lakehouse Cross-Cloud Federation (Databricks Unity Catalog & AWS Glue), Regional Caching FinOps, BigQuery AI, and Tiered Gemini 4 Multi-Agent Analytics with Google ADK 2.15+"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mani" }
]
keywords = [
  "google-cloud",
  "lakehouse",
  "bigquery",
  "bigquery-ai",
  "knowledge-catalog",
  "apache-iceberg",
  "databricks-unity-catalog",
  "aws-glue",
  "google-adk",
  "gemini-4-neon",
  "gemini-4-carbon",
  "gemini-4-hydrogen",
  "gemini-4-argon"
]
dependencies = [
  "google-adk>=2.15.0",
  "google-cloud-bigquery>=3.47.0",
  "google-genai>=2.34.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]
observability = [
  "google-adk[bigquery-analytics]>=2.15.0",
  "google-cloud-dataplex>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
